spring:
  application:
    name: tcp-proxy
  main:
    allow-bean-definition-overriding: true

# 代理配置
proxy:
  # 本地服务器监听端口
  localPort: 12289
  # 远程服务器地址
  remoteHost: 192.168.89.1
  # 远程服务器端口
  remotePort: 12289

# 日志配置
logging:
  level:
    root: INFO
    com.example.tcpproxy: DEBUG
  file:
    name: logs/tcp-proxy.log 