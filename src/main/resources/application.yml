spring:
  application:
    name: serial-proxy
  main:
    allow-bean-definition-overriding: true

# 串口代理配置
proxy:
  # 源串口配置
  sourcePort:
    portName: "COM5"
    baudRate: 9600
    dataBits: 8
    stopBits: 1
    parity: 0
    flowControl: 0
  # 目标串口配置
  targetPort:
    portName: "COM11"
    baudRate: 9600
    dataBits: 8
    stopBits: 1
    parity: 0
    flowControl: 0

# 日志配置
logging:
  level:
    root: INFO
    com.example.serialproxy: DEBUG
  file:
    name: logs/serial-proxy.log 